name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    permissions:
      contents: write
    # Visual Studio 2022 builds the patched SDK here, so players don't need it.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for game material
        run: python -I tools/audit_repo.py
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content launcher/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "tag must match launcher version v$version" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Set up the toolchain and SDK source
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/setup.ps1
      - name: Patch and build the SDK
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/patch-sdk.ps1
      - name: Assemble the build pack
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/make_build_pack.ps1
      - name: Pack project source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launcher/src-tauri/resources | Out-Null
          git archive --format=zip -o launcher/src-tauri/resources/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.1 --locked
      - name: Build installer
        working-directory: launcher/src-tauri
        run: cargo tauri build --config tauri.bundle.conf.json
      - name: Collect installer
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem launcher/src-tauri/target/release/bundle/nsis/*.exe)
          if ($setups.Count -ne 1) { throw 'expected exactly one installer' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $setups[0].FullName "dist/LostLauncher-${{ steps.version.outputs.value }}-windows-x64-setup.exe"
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: lost-launcher-installer
          path: dist/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
